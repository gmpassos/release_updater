name: release_updater
description: A simple way to automatically update release/installation files in a local directory.
version: 1.3.2
homepage: https://github.com/gmpassos/release_updater

environment:
  sdk: '>=3.10.0 <4.0.0'

executables:
  release_updater:
  release_updater_server:
  release_packer:
  release_utility:


dependencies:
  data_serializer: ^1.2.3
  ascii_art_tree: ^1.0.6
  mercury_client: ^2.4.0
  shelf: ^1.4.3
  shelf_static: ^1.2.0
  shelf_gzip: ^4.1.0
  # 0.8.19 and 0.9 (only a newer `googleapis`): the same storage API, and
  # 0.8.19 is still required by packages like `bones_api`.
  gcloud: '>=0.8.19 <0.10.0'
  googleapis_auth: ^2.3.5
  crypto: ^3.0.8
  path: ^1.9.1
  pub_semver: ^2.2.1
  base_codecs: ^1.0.1
  archive: ^4.5.2
  collection: ^1.19.1
  yaml: ^3.1.4


dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0
  dependency_validator: ^5.1.0
  coverage: ^1.16.0
  pubspec: ^2.3.0

#dependency_overrides:
