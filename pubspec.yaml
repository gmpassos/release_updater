name: release_updater
description: A simple way to automatically update release/installation files in a local directory.
version: 1.1.13
homepage: https://github.com/gmpassos/release_updater

environment:
  sdk: '>=3.10.0 <4.0.0'

executables:
  release_updater:
  release_updater_server:
  release_packer:
  release_utility:


dependencies:
  data_serializer: ^1.2.3
  ascii_art_tree: ^1.0.6
  mercury_client: ^2.3.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  shelf_gzip: ^4.1.0
  gcloud: ^0.8.19
  googleapis_auth: ^2.3.3
  crypto: ^3.0.7
  path: ^1.9.1
  pub_semver: ^2.2.0
  base_codecs: ^1.0.1
  archive: ^4.0.9
  collection: ^1.19.1
  yaml: ^3.1.3


dev_dependencies:
  lints: ^5.1.1
  test: ^1.31.1
  dependency_validator: ^5.0.5
  coverage: ^1.15.1
  pubspec: ^2.3.0

